<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Dashboard - USMD</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233b82f6'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' font-weight='bold' fill='white'>US</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-card: rgba(22, 27, 58, 0.8);
            --bg-card-hover: rgba(30, 35, 70, 0.9);
            --border: rgba(99, 102, 241, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse at top left, rgba(99,102,241,0.08) 0%, transparent 50%),
                              radial-gradient(ellipse at bottom right, rgba(139,92,246,0.06) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left { display: flex; align-items: center; }
        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .date-input:focus { border-color: var(--accent); }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #4f46e5; box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--text-primary); }

        .nav-links {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .nav-links a:hover { border-color: var(--accent); color: var(--text-primary); }
        .nav-links a.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .kpi-card:hover { background: var(--bg-card-hover); border-color: var(--accent); }
        .kpi-card .label { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .kpi-card .value { font-size: 1.6rem; font-weight: 700; }
        .kpi-card .sub { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; }
        .kpi-card.green .value { color: var(--green); }
        .kpi-card.red .value { color: var(--red); }
        .kpi-card.blue .value { color: var(--blue); }
        .kpi-card.purple .value { color: var(--purple); }
        .kpi-card.yellow .value { color: var(--yellow); }
        .kpi-card.cyan .value { color: var(--cyan); }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .chart-card h3 { font-size: 0.95rem; margin-bottom: 16px; color: var(--text-primary); }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 0.9rem;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .preset-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .preset-btns .btn { padding: 6px 12px; font-size: 0.75rem; }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/">Overview</a>
        <a href="/monthly-summary">Monthly Summary</a>
        <a href="/sdr">SDR</a>
        <a href="/stripe-dashboard" class="active">Stripe</a>
    </div>

    <div class="header">
        <div class="header-left">
            <div>
                <h1>Stripe Dashboard</h1>
                <p>MRR, Revenue & Churn from Stripe</p>
            </div>
        </div>
        <div class="controls">
            <div class="preset-btns">
                <button class="btn btn-ghost" onclick="setPreset('mtd')">MTD</button>
                <button class="btn btn-ghost" onclick="setPreset('last30')">Last 30d</button>
                <button class="btn btn-ghost" onclick="setPreset('last3m')">Last 3m</button>
                <button class="btn btn-ghost" onclick="setPreset('last6m')">Last 6m</button>
                <button class="btn btn-ghost" onclick="setPreset('ytd')">YTD</button>
                <button class="btn btn-ghost" onclick="setPreset('all')">All Time</button>
            </div>
            <input type="date" id="startDate" class="date-input">
            <input type="date" id="endDate" class="date-input">
            <button class="btn btn-primary" onclick="loadData()">Apply</button>
        </div>
    </div>

    <div class="kpi-grid" id="kpiGrid">
        <div class="loading">Loading Stripe data</div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h3>Monthly Revenue</h3>
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>Monthly Churn (Cancellations)</h3>
            <canvas id="churnChart"></canvas>
        </div>
    </div>

    <script>
        let revenueChart = null;
        let churnChart = null;

        function setPreset(preset) {
            const now = new Date();
            let start, end;
            end = now.toISOString().split('T')[0];

            switch (preset) {
                case 'mtd':
                    start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                    break;
                case 'last30':
                    start = new Date(now - 30 * 86400000).toISOString().split('T')[0];
                    break;
                case 'last3m':
                    start = new Date(now.getFullYear(), now.getMonth() - 3, 1).toISOString().split('T')[0];
                    break;
                case 'last6m':
                    start = new Date(now.getFullYear(), now.getMonth() - 6, 1).toISOString().split('T')[0];
                    break;
                case 'ytd':
                    start = `${now.getFullYear()}-01-01`;
                    break;
                case 'all':
                    start = '2022-01-01';
                    break;
            }

            document.getElementById('startDate').value = start;
            document.getElementById('endDate').value = end;
            loadData();
        }

        function formatCurrency(val) {
            return '$' + val.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        function formatCurrencyFull(val) {
            return '$' + val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function loadData() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            let params = new URLSearchParams();
            if (start) params.set('start', start);
            if (end) params.set('end', end);

            const qs = params.toString() ? '?' + params.toString() : '';

            document.getElementById('kpiGrid').innerHTML = '<div class="loading">Loading Stripe data</div>';

            try {
                const resp = await fetch('/api/stripe/summary' + qs);
                if (!resp.ok) {
                    let errMsg = `HTTP ${resp.status}`;
                    try { const ej = await resp.json(); errMsg = ej.error || errMsg; } catch(e) {}
                    throw new Error(errMsg);
                }
                const data = await resp.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('kpiGrid').innerHTML = `
                    <div class="kpi-card green">
                        <div class="label">Current MRR</div>
                        <div class="value">${formatCurrency(data.mrr)}</div>
                        <div class="sub">${data.active} active subs</div>
                    </div>
                    <div class="kpi-card blue">
                        <div class="label">Revenue (Period)</div>
                        <div class="value">${formatCurrency(data.revenue)}</div>
                        <div class="sub">${start || 'All time'} to ${end || 'now'}</div>
                    </div>
                    <div class="kpi-card red">
                        <div class="label">Cancellations</div>
                        <div class="value">${data.churn_count}</div>
                        <div class="sub">Lost MRR: ${formatCurrencyFull(data.lost_mrr)}</div>
                    </div>
                    <div class="kpi-card yellow">
                        <div class="label">Churn Rate</div>
                        <div class="value">${data.churn_rate}%</div>
                        <div class="sub">Canceled / (Active + Canceled)</div>
                    </div>
                    <div class="kpi-card purple">
                        <div class="label">Past Due</div>
                        <div class="value">${data.past_due}</div>
                        <div class="sub">At risk of churning</div>
                    </div>
                    <div class="kpi-card cyan">
                        <div class="label">Paused</div>
                        <div class="value">${data.paused}</div>
                        <div class="sub">Temporarily paused</div>
                    </div>
                `;

                renderRevenueChart(data.monthly);
                renderChurnChart(data.monthly);
            } catch (err) {
                document.getElementById('kpiGrid').innerHTML = `<div class="loading" style="color:var(--red)">Error loading data: ${err.message}</div>`;
            }
        }

        function renderRevenueChart(monthly) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            if (revenueChart) revenueChart.destroy();

            revenueChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthly.map(m => m.month),
                    datasets: [{
                        label: 'Revenue',
                        data: monthly.map(m => m.revenue),
                        backgroundColor: 'rgba(99, 102, 241, 0.6)',
                        borderColor: '#6366f1',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => formatCurrencyFull(ctx.parsed.y)
                            }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(99,102,241,0.08)' } },
                        y: {
                            ticks: {
                                color: '#94a3b8',
                                callback: val => '$' + (val / 1000).toFixed(0) + 'k'
                            },
                            grid: { color: 'rgba(99,102,241,0.08)' }
                        }
                    }
                }
            });
        }

        function renderChurnChart(monthly) {
            const ctx = document.getElementById('churnChart').getContext('2d');
            if (churnChart) churnChart.destroy();

            churnChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthly.map(m => m.month),
                    datasets: [{
                        label: 'Cancellations',
                        data: monthly.map(m => m.churn),
                        backgroundColor: 'rgba(239, 68, 68, 0.6)',
                        borderColor: '#ef4444',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => ctx.parsed.y + ' cancellations'
                            }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(99,102,241,0.08)' } },
                        y: {
                            ticks: { color: '#94a3b8', stepSize: 1 },
                            grid: { color: 'rgba(99,102,241,0.08)' }
                        }
                    }
                }
            });
        }

        // Default: last 6 months
        setPreset('last6m');
    </script>
</body>
</html>
