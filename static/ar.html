<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Record — Workspaces</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233b82f6'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' font-weight='bold' fill='white'>AR</text></svg>">
    <style>
        :root {
            --bg-primary: #1a1d23;
            --bg-secondary: #22262e;
            --bg-card: #2a2e37;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --green: #10b981;
            --green-hover: #34d399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .top-bar .nav-links {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .top-bar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }
        .top-bar .nav-links a:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Workspaces Grid */
        .workspaces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .workspace-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: border-color 0.2s;
        }
        .workspace-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }
        .workspace-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        .workspace-info {
            flex: 1;
            min-width: 0;
        }
        .workspace-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .workspace-meta {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .btn-launch {
            background: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }
        .btn-launch:hover {
            background: var(--green-hover);
            transform: translateY(-1px);
        }

        /* Clients View */
        .clients-view {
            display: none;
        }
        .clients-view.active {
            display: block;
        }
        .workspaces-view.hidden {
            display: none;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 20px;
            cursor: pointer;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .clients-header {
            margin-bottom: 24px;
        }
        .clients-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .clients-header .client-count {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: auto;
            max-height: calc(100vh - 280px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }
        tr:hover td {
            background: rgba(99, 102, 241, 0.04);
        }
        tr:last-child td {
            border-bottom: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container { padding: 20px 16px; }
            .workspaces-grid { grid-template-columns: 1fr; }
            .workspace-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="logo">Aesthetic Record</span>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/monthly-summary">Monthly Summary</a>
            <a href="/stripe-dashboard">Stripe</a>
        </div>
    </div>

    <div class="container">
        <!-- Workspaces View -->
        <div class="workspaces-view" id="workspacesView">
            <div class="page-header">
                <h1>Workspaces</h1>
                <p>Select a workspace to view its clients</p>
            </div>
            <div id="workspacesGrid" class="workspaces-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading workspaces...</div>
                </div>
            </div>
        </div>

        <!-- Clients View -->
        <div class="clients-view" id="clientsView">
            <button class="back-btn" onclick="showWorkspaces()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Workspaces
            </button>
            <div class="clients-header">
                <h2 id="clinicTitle"></h2>
                <div class="client-count" id="clientCount"></div>
            </div>
            <div id="clientsTable"></div>
        </div>
    </div>

    <script>
        async function loadWorkspaces() {
            const grid = document.getElementById('workspacesGrid');
            try {
                const resp = await fetch('/api/ar/workspaces');
                const data = await resp.json();
                if (!data.success) {
                    grid.innerHTML = '<div class="empty-state">Error loading workspaces</div>';
                    return;
                }
                if (!data.workspaces.length) {
                    grid.innerHTML = '<div class="empty-state">No workspaces found</div>';
                    return;
                }
                grid.innerHTML = data.workspaces.map(w => {
                    const initials = w.name.split(' ').map(x => x[0]).join('').substring(0, 2).toUpperCase();
                    return `
                        <div class="workspace-card">
                            <div class="workspace-icon">${initials}</div>
                            <div class="workspace-info">
                                <div class="workspace-name">${escHtml(w.name)}</div>
                                <div class="workspace-meta">${w.client_count} client${w.client_count !== 1 ? 's' : ''}</div>
                            </div>
                            <button class="btn-launch" onclick="launchWorkspace('${escAttr(w.name)}')">Launch</button>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                grid.innerHTML = '<div class="empty-state">Failed to load workspaces</div>';
            }
        }

        async function launchWorkspace(clinicName) {
            document.getElementById('workspacesView').classList.add('hidden');
            document.getElementById('clientsView').classList.add('active');
            document.getElementById('clinicTitle').textContent = clinicName;
            document.getElementById('clientsTable').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading clients...</div></div>';
            document.getElementById('clientCount').textContent = '';

            try {
                const resp = await fetch('/api/ar/clients?clinic=' + encodeURIComponent(clinicName));
                const data = await resp.json();
                if (!data.success) {
                    document.getElementById('clientsTable').innerHTML = '<div class="empty-state">Error loading clients</div>';
                    return;
                }
                document.getElementById('clientCount').textContent = data.count + ' client' + (data.count !== 1 ? 's' : '');
                renderClientsTable(data.clients);
            } catch (e) {
                document.getElementById('clientsTable').innerHTML = '<div class="empty-state">Failed to load clients</div>';
            }
        }

        function renderClientsTable(clients) {
            const container = document.getElementById('clientsTable');
            if (!clients.length) {
                container.innerHTML = '<div class="empty-state">No clients in this workspace</div>';
                return;
            }
            let html = '<div class="table-container"><table><thead><tr><th>First Name</th><th>Last Name</th></tr></thead><tbody>';
            clients.forEach(c => {
                html += '<tr><td>' + escHtml(c.first_name) + '</td><td>' + escHtml(c.last_name) + '</td></tr>';
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function showWorkspaces() {
            document.getElementById('workspacesView').classList.remove('hidden');
            document.getElementById('clientsView').classList.remove('active');
        }

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function escAttr(str) {
            if (!str) return '';
            return str.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
        }

        loadWorkspaces();
    </script>
</body>
</html>
