<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Record — Workspaces</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233b82f6'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' font-weight='bold' fill='white'>AR</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: #ffffff;
            color: #333;
            min-height: 100vh;
            font-size: 16px;
        }

        /* Header */
        .top-bar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 0;
            text-decoration: none;
        }
        .top-bar .logo img {
            height: 48px;
            width: auto;
        }
        .top-bar .nav-links {
            display: flex;
            gap: 16px;
            margin-left: auto;
            align-items: center;
        }
        .top-bar .nav-links a {
            color: #555;
            text-decoration: none;
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .top-bar .nav-links a:hover {
            background: #f3f4f6;
            color: #111;
        }
        .top-bar .nav-links .btn-get-started {
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 500;
        }
        .top-bar .nav-links .btn-get-started:hover {
            border-color: #2196F3;
            color: #2196F3;
        }

        /* Container */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 32px;
        }

        /* Back link */
        .back-link {
            color: #2196F3;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 18px;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        /* Page header with count and search */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a1a1a;
        }
        .search-box {
            position: relative;
        }
        .search-box input {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 10px 16px 10px 38px;
            font-size: 1rem;
            width: 240px;
            outline: none;
            transition: border-color 0.2s;
            color: #333;
        }
        .search-box input:focus {
            border-color: #2196F3;
        }
        .search-box input::placeholder {
            color: #9ca3af;
        }
        .search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
            height: 18px;
        }

        /* Alphabet section headers */
        .alpha-header {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1a1a1a;
            padding: 16px 0 10px 0;
            border-bottom: none;
        }

        /* Workspace rows */
        .workspace-row {
            display: flex;
            align-items: center;
            padding: 16px 16px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }
        .workspace-row:hover {
            background: #f9fafb;
        }
        .workspace-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 18px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .workspace-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .workspace-name {
            font-size: 1.05rem;
            font-weight: 500;
            color: #333;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-badge {
            font-size: 0.9rem;
            font-weight: 500;
            color: #10b981;
            font-style: italic;
            margin-left: 14px;
            margin-right: auto;
            padding-left: 18px;
        }
        .btn-launch {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .btn-launch:hover {
            background: #1976D2;
        }

        /* Clients View */
        .clients-view {
            display: none;
        }
        .clients-view.active {
            display: block;
        }
        .workspaces-view.hidden {
            display: none;
        }

        /* Clients page header */
        .clients-page-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .clients-page-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
        }
        .clients-search-box {
            position: relative;
        }
        .clients-search-box input {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 10px 16px 10px 38px;
            font-size: 1rem;
            width: 220px;
            outline: none;
            transition: border-color 0.2s;
            color: #333;
        }
        .clients-search-box input:focus {
            border-color: #2196F3;
        }
        .clients-search-box input::placeholder {
            color: #9ca3af;
        }
        .clients-search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
            height: 18px;
        }

        /* Alphabet filter */
        .alpha-filter {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            align-items: center;
        }
        .alpha-filter .alpha-btn {
            background: none;
            border: none;
            padding: 5px 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .alpha-filter .alpha-btn:hover {
            color: #2196F3;
            background: #eff6ff;
        }
        .alpha-filter .alpha-btn.active {
            color: #2196F3;
            font-weight: 700;
        }

        /* Clients table */
        .table-container {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: auto;
            max-height: calc(100vh - 320px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        th {
            background: #f9fafb;
            color: #6b7280;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 14px 24px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        td {
            padding: 14px 24px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 1rem;
        }
        tr:hover td {
            background: #f9fafb;
        }
        tr:last-child td {
            border-bottom: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #9ca3af;
            font-size: 1rem;
        }
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #2196F3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
            font-size: 1rem;
        }

        /* Back button */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #2196F3;
            font-size: 1rem;
            cursor: pointer;
            background: none;
            border: none;
            margin-bottom: 18px;
            padding: 0;
        }
        .back-btn:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .search-box input { width: 100%; }
            .workspace-row { padding: 12px 8px; }
            body { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="logo" href="/ar">
            <img src="/static/ar-logo.png" alt="Aesthetic Record">
        </a>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/monthly-summary">Monthly Summary</a>
            <a href="/stripe-dashboard">Stripe</a>
        </div>
    </div>

    <div class="container">
        <!-- Workspaces View -->
        <div class="workspaces-view" id="workspacesView">
            <a class="back-link" href="/">&#60; Back</a>
            <div class="page-header">
                <h1 id="workspacesTitle">All Workspaces</h1>
                <div class="search-box">
                    <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="workspaceSearch" placeholder="Search..." oninput="filterWorkspaces()">
                </div>
            </div>
            <div id="workspacesGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading workspaces...</div>
                </div>
            </div>
        </div>

        <!-- Clients View -->
        <div class="clients-view" id="clientsView">
            <button class="back-btn" onclick="showWorkspaces()">
                &#60; Back to Workspaces
            </button>
            <div class="clients-page-header">
                <h2 id="clinicTitle"></h2>
                <div class="clients-search-box">
                    <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" id="clientSearch" placeholder="Search" oninput="filterClients()">
                </div>
            </div>
            <div class="alpha-filter" id="alphaFilter"></div>
            <div id="clientsTable"></div>
        </div>
    </div>

    <script>
        let allWorkspaces = [];
        let allClients = [];
        let activeAlpha = 'All';

        async function loadWorkspaces() {
            const grid = document.getElementById('workspacesGrid');
            try {
                const resp = await fetch('/api/ar/workspaces');
                const data = await resp.json();
                if (!data.success) {
                    grid.innerHTML = '<div class="empty-state">Error loading workspaces</div>';
                    return;
                }
                if (!data.workspaces.length) {
                    grid.innerHTML = '<div class="empty-state">No workspaces found</div>';
                    return;
                }
                allWorkspaces = data.workspaces;
                document.getElementById('workspacesTitle').textContent = 'All Workspaces: ' + allWorkspaces.length;
                renderWorkspaces(allWorkspaces);
            } catch (e) {
                grid.innerHTML = '<div class="empty-state">Failed to load workspaces</div>';
            }
        }

        function renderWorkspaces(workspaces) {
            const grid = document.getElementById('workspacesGrid');
            if (!workspaces.length) {
                grid.innerHTML = '<div class="empty-state">No workspaces match your search</div>';
                return;
            }

            let currentLetter = '';
            let html = '';

            workspaces.forEach(w => {
                const firstLetter = w.name.charAt(0).toUpperCase();
                if (firstLetter !== currentLetter) {
                    currentLetter = firstLetter;
                    html += '<div class="alpha-header">' + currentLetter + '</div>';
                }
                html += `
                    <div class="workspace-row">
                        <div class="workspace-logo"><img src="/static/ar-logo.png" alt="AR"></div>
                        <div class="workspace-name">${escHtml(w.name)}</div>
                        <span class="status-badge">Active</span>
                        <button class="btn-launch" onclick="launchWorkspace('${escAttr(w.name)}')">Launch</button>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function filterWorkspaces() {
            const query = document.getElementById('workspaceSearch').value.toLowerCase().trim();
            if (!query) {
                renderWorkspaces(allWorkspaces);
                return;
            }
            const filtered = allWorkspaces.filter(w => w.name.toLowerCase().includes(query));
            renderWorkspaces(filtered);
        }

        async function launchWorkspace(clinicName) {
            document.getElementById('workspacesView').classList.add('hidden');
            document.getElementById('clientsView').classList.add('active');
            document.getElementById('clinicTitle').textContent = 'Clients';
            document.getElementById('clientsTable').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading clients...</div></div>';
            document.getElementById('clientSearch').value = '';
            activeAlpha = 'All';

            try {
                const resp = await fetch('/api/ar/clients?clinic=' + encodeURIComponent(clinicName));
                const data = await resp.json();
                if (!data.success) {
                    document.getElementById('clientsTable').innerHTML = '<div class="empty-state">Error loading clients</div>';
                    return;
                }
                allClients = data.clients;
                document.getElementById('clinicTitle').textContent = 'Clients : ' + data.count;
                buildAlphaFilter();
                renderClientsTable(allClients);
            } catch (e) {
                document.getElementById('clientsTable').innerHTML = '<div class="empty-state">Failed to load clients</div>';
            }
        }

        function buildAlphaFilter() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            let html = '<button class="alpha-btn active" onclick="setAlphaFilter(\'All\')">All</button>';
            letters.forEach(l => {
                html += `<button class="alpha-btn" onclick="setAlphaFilter('${l}')">${l}</button>`;
            });
            document.getElementById('alphaFilter').innerHTML = html;
        }

        function setAlphaFilter(letter) {
            activeAlpha = letter;
            const btns = document.querySelectorAll('.alpha-filter .alpha-btn');
            btns.forEach(btn => {
                btn.classList.toggle('active', btn.textContent === letter);
            });
            filterClients();
        }

        function filterClients() {
            const query = document.getElementById('clientSearch').value.toLowerCase().trim();
            let filtered = allClients;

            if (activeAlpha !== 'All') {
                filtered = filtered.filter(c => {
                    const fn = (c.first_name || '').charAt(0).toUpperCase();
                    return fn === activeAlpha;
                });
            }

            if (query) {
                filtered = filtered.filter(c => {
                    const full = ((c.first_name || '') + ' ' + (c.last_name || '')).toLowerCase();
                    return full.includes(query);
                });
            }

            renderClientsTable(filtered);
        }

        function renderClientsTable(clients) {
            const container = document.getElementById('clientsTable');
            if (!clients.length) {
                container.innerHTML = '<div class="empty-state">No clients found</div>';
                return;
            }
            let html = '<div class="table-container"><table><thead><tr><th>First Name</th><th>Last Name</th></tr></thead><tbody>';
            clients.forEach(c => {
                html += '<tr><td>' + escHtml(c.first_name) + '</td><td>' + escHtml(c.last_name) + '</td></tr>';
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function showWorkspaces() {
            document.getElementById('workspacesView').classList.remove('hidden');
            document.getElementById('clientsView').classList.remove('active');
        }

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function escAttr(str) {
            if (!str) return '';
            return str.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
        }

        loadWorkspaces();
    </script>
</body>
</html>
