<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Record — USMD</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233b82f6'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' font-weight='bold' fill='white'>US</text></svg>">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-card: rgba(22, 27, 58, 0.8);
            --border: rgba(99, 102, 241, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .controls label {
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
        .controls input[type="date"] {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 0.85rem;
            outline: none;
        }
        .controls input[type="date"]:focus {
            border-color: var(--accent);
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--accent);
        }
        .btn-update {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
        }
        .btn-update:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
        }
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.85rem;
        }
        .stat-chip strong {
            color: var(--accent);
        }
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: auto;
            max-height: calc(100vh - 260px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 1200px;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        th {
            background: rgba(30, 35, 75, 0.95);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            padding: 12px 10px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 10px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.06);
            vertical-align: top;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        tr:hover td {
            background: rgba(99, 102, 241, 0.04);
        }
        td.notes-cell {
            min-width: 450px;
            max-width: 600px;
            white-space: normal;
            word-break: break-word;
        }
        .note-block {
            background: rgba(99, 102, 241, 0.06);
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 0 6px 6px 0;
            font-size: 0.78rem;
            line-height: 1.4;
        }
        .note-block:last-child { margin-bottom: 0; }
        .note-date {
            color: var(--accent);
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
        .loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .client-link {
            color: var(--accent);
            text-decoration: none;
        }
        .client-link:hover {
            text-decoration: underline;
        }
        .expand-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 6px;
        }
        .expand-btn:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/monthly-summary">Monthly Summary</a>
        <a href="/sdr">SDR</a>
        <a href="/stripe-dashboard">Stripe</a>
    </div>

    <div class="header">
        <h1>Aesthetic Record — Client Data</h1>
        <div class="controls">
            <label>From</label>
            <input type="date" id="startDate">
            <label>To</label>
            <input type="date" id="endDate">
            <button class="btn btn-primary" onclick="loadClients()">Filter</button>
            <button class="btn btn-secondary" onclick="clearFilter()">Clear</button>
        </div>
    </div>

    <div class="stats-bar" id="statsBar"></div>
    <div id="errorBox"></div>
    <div id="tableContainer">
        <div class="loading">
            <div class="spinner"></div>
            <div>Loading clients from MongoDB...</div>
        </div>
    </div>

    <script>
        function init() {
            loadClients();
        }

        async function loadClients() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            const container = document.getElementById('tableContainer');
            const errorBox = document.getElementById('errorBox');
            errorBox.innerHTML = '';

            container.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading clients...</div></div>';

            let url = '/api/ar/clients';
            const params = [];
            if (start) params.push('start=' + start);
            if (end) params.push('end=' + end);
            if (params.length) url += '?' + params.join('&');

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                if (!data.success) {
                    errorBox.innerHTML = '<div class="error-msg">Error: ' + (data.error || 'Unknown error') + '</div>';
                    container.innerHTML = '';
                    return;
                }
                renderStats(data);
                renderTable(data.clients);
            } catch (e) {
                errorBox.innerHTML = '<div class="error-msg">Failed to fetch data: ' + e.message + '</div>';
                container.innerHTML = '';
            }
        }

        function renderStats(data) {
            const bar = document.getElementById('statsBar');
            const clinics = new Set(data.clients.map(c => c.clinic_name).filter(Boolean));
            let totalNotes = 0;
            data.clients.forEach(c => { totalNotes += c.procedure_notes_count || 0; });
            bar.innerHTML =
                '<div class="stat-chip">Clients: <strong>' + data.count + '</strong></div>' +
                '<div class="stat-chip">Clinics: <strong>' + clinics.size + '</strong></div>' +
                '<div class="stat-chip">Procedure Notes: <strong>' + totalNotes + '</strong></div>';
        }

        const COLUMNS = [
            'clinic_name', 'name', 'client_url', 'dob', 'age',
            'address', 'email', 'phone', 'primary_clinic', 'creation_date',
            'procedure_notes_count', 'procedure_notes', 'customer_notes', 'scrape_date'
        ];
        const COL_LABELS = {
            clinic_name: 'Clinic', name: 'Client Name',
            client_url: 'URL', dob: 'DOB', age: 'Age', address: 'Address',
            email: 'Email', phone: 'Phone', primary_clinic: 'Primary Clinic',
            creation_date: 'Client Creation Date', procedure_notes_count: 'Procedure Notes Count',
            procedure_notes: 'Procedure Notes', customer_notes: 'Customer Notes',
            scrape_date: 'Scrape Date'
        };

        function renderTable(clients) {
            const container = document.getElementById('tableContainer');
            let html = '<div class="table-container"><table><thead><tr>';
            COLUMNS.forEach(col => { html += '<th>' + COL_LABELS[col] + '</th>'; });
            html += '</tr></thead><tbody>';

            if (!clients.length) {
                html += '<tr><td colspan="' + COLUMNS.length + '" style="text-align:center;color:var(--text-secondary);padding:40px">No data available</td></tr>';
            } else {
                clients.forEach((c, idx) => {
                    html += '<tr>';
                    COLUMNS.forEach(col => {
                        if (col === 'name') {
                            const nameCell = c.client_url
                                ? '<a class="client-link" href="' + escHtml(c.client_url) + '" target="_blank">' + escHtml(c.name) + '</a>'
                                : escHtml(c.name);
                            html += '<td>' + nameCell + '</td>';
                        } else if (col === 'client_url') {
                            html += '<td>' + (c.client_url ? '<a class="client-link" href="' + escHtml(c.client_url) + '" target="_blank">Link</a>' : '') + '</td>';
                        } else if (col === 'procedure_notes') {
                            html += '<td class="notes-cell">' + renderNotes(c.procedure_notes, idx) + '</td>';
                        } else if (col === 'customer_notes') {
                            html += '<td class="notes-cell">' + escHtml(String(c.customer_notes || '')) + '</td>';
                        } else if (col === 'address') {
                            html += '<td title="' + escAttr(c.address || '') + '">' + escHtml(c.address || '') + '</td>';
                        } else {
                            html += '<td>' + escHtml(String(c[col] != null ? c[col] : '')) + '</td>';
                        }
                    });
                    html += '</tr>';
                });
            }
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function renderNotes(notes, idx) {
            if (!notes || !notes.length) return '<span style="color:var(--text-secondary)">—</span>';
            const MAX_SHOW = 2;
            let html = '';
            const show = notes.slice(0, MAX_SHOW);
            show.forEach(n => { html += '<div class="note-block">' + formatNote(n) + '</div>'; });
            if (notes.length > MAX_SHOW) {
                html += '<div id="more-' + idx + '" style="display:none">';
                notes.slice(MAX_SHOW).forEach(n => { html += '<div class="note-block">' + formatNote(n) + '</div>'; });
                html += '</div>';
                html += '<button class="expand-btn" onclick="toggleNotes(' + idx + ', this)">Show ' + (notes.length - MAX_SHOW) + ' more</button>';
            }
            return html;
        }

        function toggleNotes(idx, btn) {
            const el = document.getElementById('more-' + idx);
            if (el.style.display === 'none') {
                el.style.display = 'block';
                btn.textContent = 'Show less';
            } else {
                el.style.display = 'none';
                btn.textContent = 'Show more';
            }
        }

        function formatNote(note) {
            return note.replace(/Date:\s*(\d{2}\/\d{2}\/\d{4})/g, '<span class="note-date">Date: $1</span>');
        }

        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function escAttr(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function clearFilter() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            loadClients();
        }


        init();
    </script>
</body>
</html>
