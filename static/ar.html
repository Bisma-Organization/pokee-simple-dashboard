<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Record — USMD</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233b82f6'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' font-weight='bold' fill='white'>US</text></svg>">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-card: rgba(22, 27, 58, 0.8);
            --border: rgba(99, 102, 241, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        h2 { font-size: 1.4rem; }
        p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 500px;
            text-align: center;
            line-height: 1.6;
        }
        .btn-ar {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .btn-ar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
        }
        .info-note {
            color: var(--text-secondary);
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .nav-links {
            position: absolute;
            top: 16px;
            left: 24px;
            display: flex;
            gap: 10px;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/monthly-summary">Monthly Summary</a>
        <a href="/sdr">SDR</a>
        <a href="/stripe-dashboard">Stripe</a>
    </div>
    <h2>Aesthetic Record Portal</h2>
    <p>Access Aesthetic Record through the server proxy. Your IP address will not be exposed — all traffic routes through the server.</p>
    <a class="btn-ar" href="/proxy/ar/">Open Aesthetic Record</a>
    <span class="info-note">Traffic is routed through the server to protect your IP</span>
</body>
</html>
