<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USMD Analytics Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233b82f6'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' font-weight='bold' fill='white'>US</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-card: rgba(22, 27, 58, 0.8);
            --bg-card-hover: rgba(30, 35, 70, 0.9);
            --border: rgba(99, 102, 241, 0.15);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse at top left, rgba(99,102,241,0.08) 0%, transparent 50%),
                              radial-gradient(ellipse at bottom right, rgba(139,92,246,0.06) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-left p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .date-input:focus { border-color: var(--accent); }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #4f46e5; box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--text-primary); }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 14px 14px 0 0;
        }
        .kpi-card:nth-child(1)::before { background: var(--blue); }
        .kpi-card:nth-child(2)::before { background: var(--green); }
        .kpi-card:nth-child(3)::before { background: var(--red); }
        .kpi-card:nth-child(4)::before { background: var(--purple); }
        .kpi-card:nth-child(5)::before { background: var(--cyan); }
        .kpi-card:nth-child(6)::before { background: var(--yellow); }
        .kpi-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .kpi-value { font-size: 1.9rem; font-weight: 800; margin: 8px 0 4px; color: var(--text-primary); }
        .kpi-sub { font-size: 0.72rem; color: var(--text-secondary); }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        @media (max-width: 1100px) { .charts-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .chart-card h3 { font-size: 0.9rem; margin-bottom: 16px; color: var(--text-primary); font-weight: 600; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: rgba(15, 15, 26, 0.6);
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: var(--accent); color: #fff; }
        .tab:hover:not(.active) { color: var(--text-primary); }

        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-header h3 { font-size: 0.9rem; font-weight: 600; }
        .search-input {
            background: rgba(15, 15, 26, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            width: 220px;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }

        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        th { text-align: left; color: var(--text-muted); padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.3px; }
        td { padding: 10px 12px; border-bottom: 1px solid rgba(99,102,241,0.06); color: var(--text-secondary); }
        tr:hover td { color: var(--text-primary); background: rgba(99,102,241,0.03); }
        .table-wrap { max-height: 400px; overflow-y: auto; }
        .table-wrap::-webkit-scrollbar { width: 5px; }
        .table-wrap::-webkit-scrollbar-track { background: transparent; }
        .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .badge { padding: 3px 8px; border-radius: 20px; font-size: 0.68rem; font-weight: 600; }
        .badge-green { background: rgba(16,185,129,0.15); color: var(--green); }
        .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
        .badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }

        .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
        .page-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer; }
        .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .page-btn:hover:not(.active) { border-color: var(--accent); }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: var(--red); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-green { background: var(--green); }
        .dot-red { background: var(--red); }
        .dot-yellow { background: var(--yellow); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <svg width="38" height="38" viewBox="0 0 64 64" style="flex-shrink:0;margin-right:12px;">
                <rect width="64" height="64" rx="12" fill="#6366f1"/>
                <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">US</text>
            </svg>
            <div>
                <h1>US Medical Directors</h1>
                <p>Analytics Dashboard — GoHighLevel + Monday.com</p>
            </div>
        </div>
        <div class="controls">
            <a href="/monthly-summary" style="color:var(--text-secondary);text-decoration:none;font-size:0.82rem;padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--text-primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)'">Monthly Summary</a>
            <a href="/sdr" style="color:var(--text-secondary);text-decoration:none;font-size:0.82rem;padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--text-primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)'">SDR Performance</a>
            <input type="date" class="date-input" id="startDate">
            <span style="color:var(--text-muted)">to</span>
            <input type="date" class="date-input" id="endDate">
            <button class="btn btn-primary" onclick="applyFilters()">Apply</button>
            <button class="btn btn-ghost" onclick="resetFilters()">Reset</button>
            <button class="btn btn-ghost" onclick="refreshData()">&#8635; Refresh</button>
        </div>
    </div>

    <div id="app">
        <div class="loading"><div class="spinner"></div>Loading analytics data...</div>
    </div>

    <script>
    let charts = {};
    let currentTab = 'leads';

    function getDefaultDates() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 1);
        return {
            start: start.toISOString().split('T')[0],
            end: now.toISOString().split('T')[0]
        };
    }

    function init() {
        const defaults = getDefaultDates();
        document.getElementById('startDate').value = defaults.start;
        document.getElementById('endDate').value = defaults.end;
        loadDashboard();
    }

    function getDateParams() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        return `start=${start}&end=${end}`;
    }

    function applyFilters() { loadDashboard(); }
    function resetFilters() {
        const defaults = getDefaultDates();
        document.getElementById('startDate').value = defaults.start;
        document.getElementById('endDate').value = defaults.end;
        loadDashboard();
    }
    async function refreshData() {
        await fetch('/api/refresh', { method: 'POST' });
        loadDashboard();
    }

    async function loadDashboard() {
        document.getElementById('app').innerHTML = '<div class="loading"><div class="spinner"></div>Loading analytics data...</div>';
        try {
            const params = getDateParams();
            const [kpis, revenue, leadsMonthly] = await Promise.all([
                fetch(`/api/kpis?${params}`).then(r => r.json()),
                fetch(`/api/revenue?${params}`).then(r => r.json()),
                fetch(`/api/leads-monthly?${params}`).then(r => r.json())
            ]);
            renderDashboard(kpis, revenue, leadsMonthly);
            loadTable(currentTab);
        } catch(e) {
            document.getElementById('app').innerHTML = '<div class="loading error">Failed to load data. Check API configuration.</div>';
        }
    }

    function formatNum(n) {
        if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n/1000).toFixed(1) + 'K';
        return n.toLocaleString();
    }
    function formatCurrency(n) {
        return '$' + n.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
    }

    function renderDashboard(kpis, revenue, leadsMonthly) {
        const html = `
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">Total Leads</div>
                    <div class="kpi-value">${formatNum(kpis.leads)}</div>
                    <div class="kpi-sub">In selected period</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Sales (Won)</div>
                    <div class="kpi-value">${formatNum(kpis.sales)}</div>
                    <div class="kpi-sub">Monday.com Closed Deals</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Churn (Lost)</div>
                    <div class="kpi-value">${formatNum(kpis.churn)}</div>
                    <div class="kpi-sub">Cancelled / Inactive clients</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Calls Made</div>
                    <div class="kpi-value">${formatNum(kpis.calls)}</div>
                    <div class="kpi-sub">Phone conversations</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Revenue</div>
                    <div class="kpi-value">${formatCurrency(kpis.revenue)}</div>
                    <div class="kpi-sub">From Closed Deals fees</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Avg $ / Sale</div>
                    <div class="kpi-value">${formatCurrency(kpis.avg_per_sale)}</div>
                    <div class="kpi-sub">Revenue &div; sales</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Revenue Over Time</h3>
                    <canvas id="revenueChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Leads by Month</h3>
                    <canvas id="leadsChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Sales vs Churn</h3>
                    <canvas id="churnChart"></canvas>
                </div>
            </div>

            <div class="table-card">
                <div class="tabs">
                    <button class="tab ${currentTab==='leads'?'active':''}" onclick="switchTab('leads')">Leads</button>
                    <button class="tab ${currentTab==='sales'?'active':''}" onclick="switchTab('sales')">Sales</button>
                    <button class="tab ${currentTab==='churn'?'active':''}" onclick="switchTab('churn')">Churn</button>
                    <button class="tab ${currentTab==='calls'?'active':''}" onclick="switchTab('calls')">Calls</button>
                    <button class="tab ${currentTab==='revenue'?'active':''}" onclick="switchTab('revenue')">Revenue</button>
                    <button class="tab ${currentTab==='payments'?'active':''}" onclick="switchTab('payments')">Payments</button>
                </div>
                <div class="table-header">
                    <h3 id="tableTitle">Recent Leads</h3>
                    <input type="text" class="search-input" id="tableSearch" placeholder="Search by name or email..." oninput="filterTable()">
                </div>
                <div class="table-wrap" id="tableBody"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        `;
        document.getElementById('app').innerHTML = html;

        renderRevenueChart(revenue.monthly);
        renderLeadsChart(leadsMonthly.monthly);
        renderChurnChart(kpis);
    }

    function renderRevenueChart(monthly) {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        if (charts.revenue) charts.revenue.destroy();
        charts.revenue = new Chart(ctx, {
            type: 'line',
            data: {
                labels: monthly.map(m => m.month),
                datasets: [{
                    label: 'Revenue',
                    data: monthly.map(m => m.revenue),
                    borderColor: '#06b6d4',
                    backgroundColor: 'rgba(6,182,212,0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#06b6d4'
                }]
            },
            options: chartOptions('$')
        });
    }

    function renderLeadsChart(monthly) {
        const ctx = document.getElementById('leadsChart').getContext('2d');
        if (charts.leads) charts.leads.destroy();
        charts.leads = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: monthly.map(m => m.month),
                datasets: [{
                    label: 'Leads',
                    data: monthly.map(m => m.count),
                    backgroundColor: 'rgba(99,102,241,0.7)',
                    borderRadius: 6,
                    borderSkipped: false
                }]
            },
            options: chartOptions()
        });
    }

    function renderChurnChart(kpis) {
        const ctx = document.getElementById('churnChart').getContext('2d');
        if (charts.churn) charts.churn.destroy();
        charts.churn = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Sales (Won)', 'Churn (Lost)', 'Open'],
                datasets: [{
                    data: [kpis.sales, kpis.churn, kpis.leads - kpis.sales - kpis.churn],
                    backgroundColor: ['rgba(16,185,129,0.8)', 'rgba(239,68,68,0.8)', 'rgba(99,102,241,0.4)'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 16, font: { size: 11 } } }
                }
            }
        });
    }

    function chartOptions(prefix) {
        return {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } },
                y: {
                    ticks: {
                        color: '#64748b',
                        font: { size: 10 },
                        callback: v => prefix ? prefix + formatNum(v) : formatNum(v)
                    },
                    grid: { color: 'rgba(99,102,241,0.06)' },
                    beginAtZero: true
                }
            }
        };
    }

    let tableData = [];
    let tablePage = 1;

    function switchTab(tab) {
        currentTab = tab;
        tablePage = 1;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab:nth-child(${['leads','sales','churn','calls','revenue','payments'].indexOf(tab)+1})`).classList.add('active');
        document.getElementById('tableSearch').value = '';
        loadTable(tab);
    }

    async function loadTable(tab) {
        const params = getDateParams();
        const titles = { leads: 'Recent Leads', sales: 'Closed Deals', churn: 'Cancelled / Inactive Clients', calls: 'Phone Conversations', revenue: 'Revenue Records', payments: 'Client Payments (Master)' };
        document.getElementById('tableTitle').textContent = titles[tab];
        document.getElementById('tableBody').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

        let url = `/api/${tab}?${params}&page=${tablePage}&limit=50`;
        const resp = await fetch(url);
        const data = await resp.json();
        tableData = data.rows || [];
        renderTable(tab, tableData);

        if (data.pages && data.pages > 1) {
            renderPagination(data.page, data.pages);
        } else {
            document.getElementById('pagination').innerHTML = '';
        }
    }

    function renderTable(tab, rows) {
        if (!rows.length) {
            document.getElementById('tableBody').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted)">No data for selected period</div>';
            return;
        }
        let headers = '', renderRow;
        switch(tab) {
            case 'leads':
                headers = '<th>Name</th><th>Email</th><th>Phone</th><th>Date Added</th><th>Source</th>';
                renderRow = r => `<td>${r.name}</td><td>${r.email||'-'}</td><td>${r.phone||'-'}</td><td>${fmtDate(r.date)}</td><td><span class="badge badge-blue">${r.source||'Direct'}</span></td>`;
                break;
            case 'sales':
                headers = '<th>Business</th><th>Contact</th><th>Email</th><th>Fee</th><th>Status</th><th>First Payment</th><th>Last Payment</th>';
                renderRow = r => `<td>${r.name}</td><td>${r.contact||'-'}</td><td style="font-size:0.72rem">${r.email||'-'}</td><td style="font-weight:600;color:var(--green)">$${(r.fee||0).toLocaleString()}</td><td><span class="badge badge-green">${r.status||'-'}</span></td><td>${fmtDate(r.first_payment)}</td><td>${fmtDate(r.last_payment)}</td>`;
                break;
            case 'churn':
                headers = '<th>Business</th><th>Status</th><th>Start Date</th><th>Contract End Date</th>';
                renderRow = r => `<td>${r.name}</td><td><span class="badge badge-red">${r.status||'Cancelled'}</span></td><td>${fmtDate(r.start_date)}</td><td>${fmtDate(r.date)}</td>`;
                break;
            case 'calls':
                headers = '<th>Name</th><th>Phone</th><th>Direction</th><th>Date</th><th>Last Message</th>';
                renderRow = r => `<td>${r.name}</td><td>${r.phone||'-'}</td><td><span class="badge ${r.direction==='inbound'?'badge-green':'badge-blue'}">${r.direction||'-'}</span></td><td>${fmtDate(r.date)}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.lastMessage||'-'}</td>`;
                break;
            case 'revenue':
                headers = '<th>Business</th><th>Fee</th><th>First Payment</th><th>Status</th>';
                renderRow = r => `<td>${r.name}</td><td style="font-weight:600;color:var(--green)">$${(r.fee||0).toLocaleString()}</td><td>${fmtDate(r.date)}</td><td><span class="badge ${r.status==='PAID'?'badge-green':r.status?'badge-yellow':'badge-blue'}">${r.status||'-'}</span></td>`;
                break;
            case 'payments':
                headers = '<th>Business</th><th>Subscription Type</th><th>Last Payment</th><th>Due Date</th><th>Subscription Fee</th><th>Status</th><th>Late Payment Days</th>';
                renderRow = r => `<td>${r.name}</td><td>${r.subscription_type ? '<span class="badge badge-blue">'+r.subscription_type+'</span>' : '-'}</td><td>${fmtDate(r.last_payment)}</td><td>${r.due_date||'-'}</td><td style="font-weight:600">${r.subscription_fee ? '$'+r.subscription_fee : '-'}</td><td><span class="badge ${r.status==='Active'?'badge-green':r.status==='Past Due'?'badge-red':'badge-yellow'}">${r.status||'-'}</span></td><td style="font-weight:700;color:${r.late_days>0?'#dc3545':''}">${r.late_days!=null ? r.late_days+'d' : '-'}</td>`;
                break;
        }
        const html = `<table><thead><tr>${headers}</tr></thead><tbody>${rows.map(r => `<tr>${renderRow(r)}</tr>`).join('')}</tbody></table>`;
        document.getElementById('tableBody').innerHTML = html;
    }

    function fmtDate(d) {
        if (!d) return '-';
        if (typeof d === 'number') d = new Date(d).toISOString();
        try {
            const dt = new Date(d);
            return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        } catch { return d; }
    }

    function filterTable() {
        const q = document.getElementById('tableSearch').value.toLowerCase();
        if (!q) { renderTable(currentTab, tableData); return; }
        const filtered = tableData.filter(r =>
            (r.name||'').toLowerCase().includes(q) ||
            (r.email||'').toLowerCase().includes(q) ||
            (r.phone||'').includes(q)
        );
        renderTable(currentTab, filtered);
    }

    function renderPagination(current, total) {
        let html = '';
        const start = Math.max(1, current - 2);
        const end = Math.min(total, current + 2);
        if (current > 1) html += `<button class="page-btn" onclick="goPage(${current-1})">&laquo;</button>`;
        for (let i = start; i <= end; i++) {
            html += `<button class="page-btn ${i===current?'active':''}" onclick="goPage(${i})">${i}</button>`;
        }
        if (current < total) html += `<button class="page-btn" onclick="goPage(${current+1})">&raquo;</button>`;
        document.getElementById('pagination').innerHTML = html;
    }

    function goPage(p) { tablePage = p; loadTable(currentTab); }

    init();
    </script>
</body>
</html>
